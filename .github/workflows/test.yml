name: Test

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install the Docker services
        run: docker compose up --detach

      - name: Install dependencies
        run: docker compose exec --user root node npm install

      - name: Run tests for @aminnairi/facts
        run: docker compose exec --user root node npm --workspace @aminnairi/facts test

      - name: Stop the Docker services
        run: docker compose down --remove-orphans --volumes --timeout 0
